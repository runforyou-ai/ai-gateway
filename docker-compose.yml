services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: lite-ai-gateway
      POSTGRES_USER: lite-ai-gateway
      POSTGRES_PASSWORD: lite-ai-gateway
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    volumes:
      - ./docker/config.yaml:/etc/lite-ai-gateway/config.yaml:ro
      - ${LOG_DIR:-./data/logs}:/var/log/lite-ai-gateway
      - ${NATS_DATA_DIR:-./data/nats}:/data/nats
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
