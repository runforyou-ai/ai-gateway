services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ai-gateway
      POSTGRES_USER: ai-gateway
      POSTGRES_PASSWORD: ai-gateway
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/runforyou-ai/ai-gateway:latest
    build: .
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    volumes:
      - ./config.yaml:/etc/ai-gateway/config.yaml:ro
      - ${LOG_DIR:-./data/logs}:/var/log/ai-gateway
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
